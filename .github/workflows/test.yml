name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python build.py
      - run: python -m unittest discover -s tests -v
      - run: git diff --exit-code -- index.html 'guides/*.html' 'playbooks/*.html' 'templates/*.html' 'examples/*.html'
