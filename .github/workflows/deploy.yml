name: Pages - build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and validate
        run: |
          python build.py
          python -m unittest discover -s tests -v
      - name: Build and inspect bilingual-searchable PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk poppler-utils libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
          python -m pip install --disable-pip-version-check weasyprint==68.0 markdown==3.10
          python scripts/build_pdf.py
          test -s pdf/how-to-get-offer-guide.pdf
          pdftotext pdf/how-to-get-offer-guide.pdf - | grep -q 'AIPMAndy'
          pdfinfo pdf/how-to-get-offer-guide.pdf | grep -q 'Pages:'
      - name: Full-page PDF automated QA and render evidence
        run: |
          python -m pip install --disable-pip-version-check pymupdf==1.26.6 pillow==12.0.0
          python scripts/pdf_quality_gate.py
      - name: Preserve PDF QA report and every-page contact sheets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offer-pdf-qa
          path: artifacts/pdf-qa/
          if-no-files-found: warn
          retention-days: 30
      - name: Save PDF to public GitHub repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/how-to-get-offer-guide.pdf pdf/edition.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(pdf): synchronize generated Offer handbook"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages bytes after release
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import hashlib, time
          root="https://aipmandy.github.io/how-to-get-offer/"
          digest=hashlib.sha256(Path("pdf/how-to-get-offer-guide.pdf").read_bytes()).hexdigest()
          def get(path):
              req=Request(root+path,headers={"User-Agent":"Xingjue-Pages-QA/1.0"})
              with urlopen(req,timeout=15) as resp:
                  assert resp.status==200,(path,resp.status)
                  return resp.read()
          for attempt in range(24):
              try:
                  index=get("")
                  assert b"how-to-get-offer-guide.pdf" in index
                  assert b"AIPMAndy" in index and b"metaver.vip" in index and b"a6no1.cn" in index
                  pdf=get("pdf/how-to-get-offer-guide.pdf?sha="+digest[:12])
                  assert hashlib.sha256(pdf).hexdigest()==digest, "Online PDF differs from generated source"
                  robots=get("robots.txt")
                  sitemap=get("sitemap.xml")
                  assert b"Sitemap" in robots and b"<urlset" in sitemap
                  print("LIVE PASS: homepage + robots + sitemap HTTP 200; PDF SHA-256",digest)
                  break
              except Exception as exc:
                  if attempt==23: raise
                  print(f"Pages warming ({attempt+1}/24): {exc}")
                  time.sleep(5)
          PY
